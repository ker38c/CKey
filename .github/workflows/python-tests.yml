# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        export PYTHONPATH=src
        pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html
    - name: Add coverage to job summary
      if: always()
      run: |
        echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
    - name: Create coverage comment body
      if: always() && github.event_name == 'pull_request'
      run: |
        echo "## Coverage Report" > coverage-comment.md
        echo "" >> coverage-comment.md
        coverage report --format=markdown >> coverage-comment.md || echo "Coverage data not available." >> coverage-comment.md
    - name: Comment coverage on PR
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: coverage
        path: coverage-comment.md
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml
